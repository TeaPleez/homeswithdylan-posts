<!doctype html><meta charset="utf-8"><title>relay</title>
<script>
// Hands slide images to the Meta Business Suite page that embeds this frame.
// Parent posts {type:'get', files:[relative paths]}; we reply with ArrayBuffers.
const OK = /^https:\/\/business\.facebook\.com$/;
window.addEventListener('message', async (e) => {
  if (!OK.test(e.origin) || !e.data || e.data.type !== 'get') return;
  const items = [];
  try {
    for (const f of e.data.files) {
      if (!/^posts\/[\w.-]+\/[\w.-]+\.jpg$/.test(f)) throw new Error('bad path ' + f);
      const r = await fetch(f + '?v=' + Date.now());
      if (!r.ok) throw new Error(f + ' ' + r.status);
      items.push({ name: f.split('/').pop(), buf: await r.arrayBuffer() });
    }
    e.source.postMessage({ type: 'files', items }, e.origin, items.map(i => i.buf));
  } catch (err) { e.source.postMessage({ type: 'error', message: String(err) }, e.origin); }
});
parent.postMessage({ type: 'ready' }, 'https://business.facebook.com');
</script>
